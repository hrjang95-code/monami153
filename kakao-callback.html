<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오 로그인 콜백</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #fdfcfb;
    }
    h2 {
      font-size: 1.2rem;
      color: #333;
    }
    p {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h2>카카오 로그인 진행 중...</h2>
  <p>잠시만 기다려주세요.</p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        console.error('카카오 로그인 에러:', error, urlParams.get('error_description'));
        alert('카카오 로그인에 실패했습니다.');
        window.location.href = 'login.html';
        return;
      }

      if (code) {
        console.log('카카오 인가 코드 수신 성공:', code);
        // 서버가 없는 프론트엔드 환경이므로 토큰 교환은 여기서 중단.
        // 임시로 로그인 상태를 만들고 index.html로 이동.
        
        // script.js에서 사용하는 currentUser 포맷으로 임시 사용자 생성
        const currentUser = {
          uid: 'kakao_' + new Date().getTime(),
          name: '카카오 사용자',
          email: 'kakao@example.com',
          provider: 'kakao',
          isLoggedIn: true
        };
        
        localStorage.setItem('monami153_user', JSON.stringify(currentUser));
        
        // 홈 화면으로 리다이렉트
        window.location.href = 'index.html';
      } else {
        // 인가 코드도 없고 에러도 없는 잘못된 접근
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
