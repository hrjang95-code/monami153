<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONAMI 153 — Color Your Day</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="page">

    <!-- DESKTOP ONLY: brand showcase -->
    <aside class="brand" aria-label="MONAMI 153 브랜드 쇼케이스">
      <header class="brand__header">
        <a href="#" class="brand__logo" aria-label="MONAMI 153 홈">monami<span>153</span></a>
      </header>

      <section class="brand__copy">
        <p class="brand__eyebrow">153, COLOR YOUR DAY</p>
        <h1>MONAMI <em>153</em></h1>
        <p class="brand__lead">하나의 153,<br />무한한 가능성</p>

        <label class="brand__search">
          <input type="search" placeholder="어떤 153을 찾으시나요?" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.7" cy="10.7" r="6.4" />
            <path d="m15.6 15.6 4.5 4.5" />
          </svg>
        </label>

        <div class="brand__tags">
          <button>#153오리지널</button>
          <button>#토니펜</button>
          <button>#153네이처</button>
          <button>#한정판</button>
          <button>#이벤트</button>
          <button>#선물용</button>
        </div>

        <div class="brand__cards">
          <!-- 153 STORY -->
          <article class="brand-card">
            <div class="brand-card__content">
              <h2 class="brand-card__title">153 STORY</h2>
              <p class="brand-card__body">1963년부터<br />사랑받아온<br />모나미 153</p>
            </div>
            <div class="brand-card__illust" aria-hidden="true">
              <svg viewBox="0 0 64 48">
                <path d="M12 40h40M18 40V24l14-8 14 8v16M26 40v-8h12v8" stroke="#cfc8be" stroke-width="1.5" fill="none"
                  stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="32" cy="22" r="3" stroke="#cfc8be" stroke-width="1.5" fill="none" />
              </svg>
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="153 스토리 자세히 보기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>

          <!-- COLOR PICK -->
          <article class="brand-card">
            <div class="brand-card__content">
              <h2 class="brand-card__title">COLOR PICK</h2>
              <p class="brand-card__body">당신의 하루를<br />완성할<br />컬러를 찾아</p>
            </div>
            <div class="brand-card__swatches" aria-hidden="true">
              <span class="swatch" style="background:#e30613" title="RED"></span>
              <span class="swatch" style="background:#1d69b7" title="NAVY"></span>
              <span class="swatch" style="background:#07804f" title="GREEN"></span>
              <span class="swatch" style="background:#e881a4" title="PINK"></span>
              <span class="swatch" style="background:#d9cbbf" title="BEIGE"></span>
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="컬러 찾기 서비스 바로가기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>

          <!-- GIFT SHOP -->
          <article class="brand-card">
            <div class="brand-card__content">
              <h2 class="brand-card__title">GIFT SHOP</h2>
              <p class="brand-card__body">153으로 전하는<br />마음, 선물하기</p>
            </div>
            <div class="brand-card__gift-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <rect x="12" y="20" width="24" height="20" rx="2" stroke="#cfc8be" stroke-width="1.5" fill="none" />
                <rect x="10" y="14" width="28" height="6" rx="1" stroke="#cfc8be" stroke-width="1.5" fill="none" />
                <path d="M24 14v26M10 23h28" stroke="#cfc8be" stroke-width="1.5" stroke-dasharray="2 2" />
                <path d="M24 14c-2-4-7-3-5 0s5 0 5 0M24 14c2-4 7-3 5 0s-5 0-5 0" stroke="#cfc8be" stroke-width="1.5"
                  fill="none" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="선물샵 구경하기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>
        </div>
      </section>

    </aside>

    <!-- MOBILE APP: same HTML for desktop preview and mobile page -->
    <main class="app-stage">
      <section class="app">
        <header class="app__header">
          <button class="app__icon" aria-label="메뉴">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <a href="#" class="app__logo">monami<span>153</span></a>
          <button class="app__icon app__cart" aria-label="장바구니">
            <svg viewBox="0 0 24 24">
              <path d="M3 4h2l2 11h10l2-8H6" />
              <circle cx="9" cy="19" r="1" />
              <circle cx="17" cy="19" r="1" />
            </svg>
            <span class="app__cart-badge" aria-label="새로운 알림"></span>
          </button>
        </header>

        <div class="app__scroll">
          <div style="display: flex; align-items: center; justify-content: center; height: 100%; min-height: 50vh;">
            <h2 style="color: #333; font-size: 1.5rem; letter-spacing: 0.05em;">PRODUCT PAGE</h2>
          </div>
        </div>

        <nav class="bottom-nav" aria-label="하단 내비게이션">
          <button class="is-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>홈</span>
          </button>
          <button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <span>검색</span>
          </button>
          <button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span>장바구니</span>
          </button>
          <button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>마이페이지</span>
          </button>
        </nav>
      </section>
    </main>
  </div>
</body>

</html>
