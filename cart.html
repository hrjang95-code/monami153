<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONAMI 153 — Color Your Day</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="page">

    <!-- DESKTOP ONLY: brand showcase -->
    <aside class="brand" aria-label="MONAMI 153 브랜드 쇼케이스">
      <header class="brand__header">
        <a href="index.html" class="brand__logo" aria-label="MONAMI 153 홈">
          monami<span>153</span>
        </a>
      </header>

      <section class="brand__copy">
        <p class="brand__eyebrow">153, COLOR YOUR DAY</p>
        <h1>MONAMI <em>153</em></h1>

        <p class="brand__lead">
          하나의 153,<br />
          무한한 가능성
        </p>

        <label class="brand__search">
          <input type="search" placeholder="어떤 153을 찾으시나요?" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.7" cy="10.7" r="6.4" />
            <path d="m15.6 15.6 4.5 4.5" />
          </svg>
        </label>

        <div class="brand__tags">
          <button>#153오리지널</button>
          <button>#토니펜</button>
          <button>#153네이처</button>
          <button>#한정판</button>
          <button>#이벤트</button>
          <button>#선물용</button>
        </div>

        <div class="brand__cards">
          <!-- 153 STORY -->
          <article class="brand-card">
            <h2 class="brand-card__title">153 STORY</h2>
            <div class="brand-card__content">
              <p class="brand-card__body">1963년부터<br />사랑받아온<br />모나미 153</p>
            </div>
            <div class="brand-card__illust" aria-hidden="true">
              <img src="img/w_h2.png" alt="153 STORY" />
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="153 스토리 자세히 보기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>

          <!-- COLOR PICK -->
          <article class="brand-card">
            <h2 class="brand-card__title">COLOR PICK</h2>
            <div class="brand-card__content-row">
              <p class="brand-card__body">당신의 하루를<br />물들일<br />컬러를 찾아</p>
              <div class="brand-card__illust brand-card__illust--colorpick" aria-hidden="true">
                <img src="img/w_h11.png" alt="COLOR PICK" />
              </div>
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="컬러 찾기 서비스 바로가기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>

          <!-- GIFT SHOP -->
          <article class="brand-card">
            <h2 class="brand-card__title">GIFT SHOP</h2>
            <div class="brand-card__content">
              <p class="brand-card__body">153으로 전하는<br />마음, 선물하기</p>
            </div>
            <div class="brand-card__gift-icon" aria-hidden="true">
              <img src="img/w_h3.png" alt="GIFT SHOP" />
            </div>
            <div class="brand-card__footer">
              <button class="brand-card__btn" aria-label="선물샵 구경하기">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </article>
        </div>
      </section>
    </aside>

    <!-- CART -->
    <main class="app-stage">
      <section class="app">

        <header class="crt-header">
          <button
            class="crt-header__back"
            onclick="history.back()"
            aria-label="뒤로가기"
          >
            <svg viewBox="0 0 24 24">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>

          <h1 class="crt-header__title">CART</h1>
        </header>

        <div class="app__scroll crt-page">

          <!-- INTRO -->
          <div class="crt-intro">
            <p>
              담았어요. <span>●</span>
            </p>

            <p class="crt-intro__sub">
              당신이 고른 오늘의 색.
            </p>
          </div>

          <!-- CART LIST -->
          <div class="crt-list"></div>
        </div>

        <!-- SUMMARY -->
        <div class="crt-summary">

          <div class="crt-summary__top">
            <span class="crt-summary__selected">
              SELECTED: 3 ITEMS
            </span>

            <div class="crt-summary__icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"
                />
              </svg>
            </div>
          </div>

          <div class="crt-summary__row">
            <span>Product Price</span>
            <span class="crt-summary__row--price">
              ₩7,700
            </span>
          </div>

          <div class="crt-summary__row">
            <span>Delivery</span>
            <span>FREE</span>
          </div>

          <div class="crt-summary__divider"></div>

          <div class="crt-summary__total">
            <span class="crt-summary__total-label">
              TOTAL
            </span>

            <span class="crt-summary__total-val">
              ₩7,700
            </span>
          </div>

          <button
            class="crt-btn-order"
            onclick="location.href='checkout.html'"
          >
            ORDER NOW
          </button>

        </div>

      </section>
    </main>

  </div>
</body>

</html>
